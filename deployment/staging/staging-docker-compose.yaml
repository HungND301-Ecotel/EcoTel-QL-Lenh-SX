# References:
# 1. https://github.com/docker/awesome-compose/tree/master/frontnet-postgres

###
# Run: docker compose up --build

##### NOTE ###########################################
#### THIS DOCKER COMPOSE IS FOR STAGING DEVELOPMENT ####
######################################################
services:

  ktv_reverse_proxy_service:
    image: ecoteldev/ktv_reverse_proxy_img:staging
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "6868:8888"
    stdin_open: true
    # restart: always
    networks:
      - frontnet
      - backnet
    depends_on:
      - ktv_Frontend_service
      - ktv_Backend_service

  ktv_Frontend_service:
    image: ecoteldev/ktv_ecotel_frontend_img:staging
    # target: development
    stdin_open: true
    volumes:
      # For development only, to synced src code to container
      # - ./ecotel_frontend:/usr/src/app
      - /usr/src/app/node_modules
    # restart: always
    networks:
      - frontnet
  # ports:
  #   - "3000:80"
  # depends_on:
  #   - ecotel_backend_service
  
  
  ktv_Backend_service:
    env_file:
      - .env_backend
    image: ecoteldev/ktv_ecotel_backend_img:staging
    # target: development
    stdin_open: true
    volumes:
      # For development only, to synced src code to container
      # - ./Backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - ktv_db
    # ports:
    #   - "8080:8080"
    # restart: always
    networks:
      - backnet

  ktv_db:
    image: mongo
    container_name: ktv_mongo_db
    #restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - .mongodb-data:/data/db
    networks:
      - backnet
    ports:
      - "27018:27017"
  
  ktv_grafana:
    image: grafana/grafana
    container_name: ktv_grafana
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring

  ktv_loki:
    image: grafana/loki:2.9.0
    container_name: ktv_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  ktv_promtail:
    image: grafana/promtail:2.9.0
    container_name: ktv_promtail
    volumes:
      - /var/log:/var/log
      - /etc/machine-id:/etc/machine-id
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./staging-promtail-config.yaml:/etc/promtail/staging-promtail-config.yaml
    command: -config.file=/etc/promtail/staging-promtail-config.yaml
    networks:
      - monitoring


networks:
  frontnet:
  backnet:
  monitoring:

volumes:
  grafana-storage:
  


