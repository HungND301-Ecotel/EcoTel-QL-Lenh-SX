# 1. https://github.com/docker/awesome-compose/tree/master/frontnet-postgres

###
# Run: docker compose up --build

##### NOTE ###########################################
#### THIS DOCKER COMPOSE IS FOR STAGING DEVELOPMENT ####
######################################################
services:

  ktv_reverse_proxy_service:
    image: ktv_reverse_proxy_img
    build:
      context: ./WebApp/reverse_proxy
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "6868:8888"
    stdin_open: true
    # restart: always
    networks:
      - frontnet
      - backnet
    depends_on:
      - ktv_Frontend_service
      - ktv_Backend_service

  ktv_Frontend_service:
    env_file:
      - ./WebApp/Frontend/.env
    image: ktv_ecotel_frontend_img
    build:
      context: ./WebApp/Frontend
    # target: development
    stdin_open: true
    volumes:
      # For development only, to synced src code to container
      # - ./ecotel_frontend:/usr/src/app
      - /usr/src/app/node_modules
    # restart: always
    networks:
      - frontnet
  # ports:
  #   - "3000:80"
  # depends_on:
  #   - ecotel_backend_service
  
  
  ktv_Backend_service:
    env_file:
      - ./WebApp/Backend/.env
    image: ktv_ecotel_backend_img
    build:
      context: ./WebApp/Backend
    # target: development
    stdin_open: true
    volumes:
      # For development only, to synced src code to container
      # - ./Backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - ktv_db
    # ports:
    #   - "8080:8080"
    # restart: always
    networks:
      - backnet

  ktv_db:
    image: mongo
    container_name: ktv_mongo_db
    #restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - .mongodb-data:/data/db
    networks:
      - backnet
    ports:
      - "27017:27017"


networks:
  frontnet:
  backnet:


